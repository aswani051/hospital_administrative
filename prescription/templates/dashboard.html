<!DOCTYPE html>
<html>
<head>
    <title>Pharmacy Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .card{
            border:none;
            border-radius:15px;
        }

        .card h2{
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <h1 class="text-center mb-5">
        🏥 Pharmacy Dashboard
    </h1>

    <div class="row">

        <div class="col-md-3">
            <div class="card bg-primary text-white shadow">
                <div class="card-body text-center">
                    <h5>Total Prescriptions</h5>
                    <h2>{{ total }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-warning text-dark shadow">
                <div class="card-body text-center">
                    <h5>Pending</h5>
                    <h2>{{ pending }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-info text-white shadow">
                <div class="card-body text-center">
                    <h5>Processing</h5>
                    <h2>{{ processing }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-success text-white shadow">
                <div class="card-body text-center">
                    <h5>Ready / Dispensed</h5>
                    <h2>{{ ready }} / {{ dispensed }}</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-5">
        <a href="/" class="btn btn-primary btn-lg">
            Upload Prescription
        </a>

        <a href="/history/" class="btn btn-success btn-lg">
            View History
        </a>
    </div>

</div>

</body>
</html>
