{% extends "base.html" %}

{% block title %}Make an Appointment{% endblock %}

{% block content %}

<section class="py-5" style="background:#f8f9fa; min-height:80vh;">
    <div class="container">

        <div class="text-center mb-5">
            <h1 class="fw-bold text-primary">Book an Appointment</h1>
            <p class="text-muted">
                Schedule your appointment with our experienced doctors.
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7">

                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-5">

                        <form method="POST">
                            {% csrf_token %}

                            {{ form.as_p }}

                            <div class="text-center mt-4">
                                <button class="btn btn-primary btn-lg px-5 rounded-pill" type="submit">
                                    Book Appointment
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</section>

{% endblock %}
