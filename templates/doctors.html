{% extends "base.html" %}

{% block title %}Doctors{% endblock %}

{% block content %}
<h1 class="text-center my-4">Doctors Page</h1>

<div class="container">
    <div class="row">
        {% for d in doctors %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <img src="{{ d.doc_img.url }}" class="card-img-top" alt="{{ d.doc_name }}">
                <div class="card-body text-center">
                    <h5 class="card-title">Dr. {{ d.doc_name }}</h5>
                    <p class="card-text">{{ d.doc_spec }}</p>
                    <h6>{{ d.dep_name }} Department</h6>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
